name: MSAF mock conformance (not LLM validation)

on:
  push:
    branches:
      - research/working-paper-v0.1
    paths:
      - papers/working-paper-v0.1/**
      - .github/workflows/msaf-mock-conformance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact run revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run deterministic mock tests and capture evidence
        run: |
          python3 papers/working-paper-v0.1/reproduction/run_conformance.py \
            --reproduction papers/working-paper-v0.1/reproduction \
            --paper papers/working-paper-v0.1 \
            --out ci-evidence
      - name: Preserve per-test evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mock-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 90
